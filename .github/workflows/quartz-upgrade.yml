name: Weekly Quartz upgrade

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: quartz-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      # Pushes use the personal token: GITHUB_TOKEN cannot push changes under
      # .github/workflows, and its pushes would not trigger the deploy.
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0 # the merge needs full history to find what upstream has added
          token: ${{ secrets.QUARTZ_UPGRADE_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Merge, build and compare, then merge or hold
        run: bash .github/scripts/quartz-upgrade.sh
        env:
          PAT_TOKEN: ${{ secrets.QUARTZ_UPGRADE_TOKEN }}
          BOT_TOKEN: ${{ github.token }}